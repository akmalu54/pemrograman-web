<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator dan Simpan ke DB</title>
</head>
<body>

    <h2>Operasi Hitung </h2>

    <form action="proses.php" method="POST">
        <label for="angka1">Angka Pertama:</label>
        <input type="number" id="angka1" name="angka1" required><br><br>

        <label for="operator">Operator:</label>

        <label for="angka2">Angka Kedua:</label>
        <input type="number" id="angka2" name="angka2" required><br><br>

        <input type="submit" value="Hitung & Simpan">
    </form>

</body>
</html>
